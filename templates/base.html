<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}VELOCE — Luxury Sports Cars{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red: #E63030;
      --red-dark: #B01E1E;
      --gold: #C9A84C;
      --bg: #0A0A0A;
      --surface: #111111;
      --surface2: #181818;
      --border: rgba(255,255,255,0.07);
      --text: #F0EDE8;
      --muted: #888;
      --font-display: 'Bebas Neue', sans-serif;
      --font-body: 'DM Sans', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }

    /* NAV */
    nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 3rem;
      height: 64px;
      background: rgba(10,10,10,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      font-family: var(--font-display);
      font-size: 2rem;
      letter-spacing: 0.08em;
      color: var(--text);
    }
    .nav-logo span { color: var(--red); }
    .nav-links { display: flex; gap: 2rem; align-items: center; }
    .nav-links a {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--text); }
    .cart-btn {
      position: relative;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 1.1rem;
      border-radius: 4px;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .cart-btn:hover { border-color: var(--red); background: rgba(230,48,48,0.06); }
    .cart-count {
      background: var(--red);
      color: white;
      border-radius: 50%;
      width: 18px; height: 18px;
      font-size: 11px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 600;
    }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--border);
      padding: 2.5rem 3rem;
      margin-top: 6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
    }
    .footer-logo { font-family: var(--font-display); font-size: 1.4rem; color: var(--text); }
    .footer-logo span { color: var(--red); }

    /* UTILS */
    .btn-primary {
      background: var(--red);
      color: white;
      border: none;
      padding: 0.75rem 2rem;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: inline-flex; align-items: center; gap: 0.5rem;
    }
    .btn-primary:hover { background: var(--red-dark); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.7rem 1.8rem;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .btn-outline:hover { border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.04); }

    .tag {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    .tag-red { background: rgba(230,48,48,0.15); color: var(--red); border: 1px solid rgba(230,48,48,0.3); }
    .tag-gold { background: rgba(201,168,76,0.12); color: var(--gold); border: 1px solid rgba(201,168,76,0.3); }
    .tag-gray { background: rgba(255,255,255,0.06); color: var(--muted); border: 1px solid var(--border); }

    {% block extra_styles %}{% endblock %}
  </style>
</head>
<body>
  <nav>
    <a href="/" class="nav-logo">VELOC<span>E</span></a>
    <div class="nav-links">
      <a href="/">Inventory</a>
      <a href="/#categories">Categories</a>
      <a href="/cart" class="cart-btn">
        🛒 Cart
        <span class="cart-count" id="nav-cart-count">0</span>
      </a>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <footer>
    <div class="footer-logo">VELOC<span>E</span></div>
    <div>© 2024 Veloce Motors. All rights reserved. Prices in USD.</div>
    <div>Italy · Germany · UK · Japan</div>
  </footer>

  <script>
    async function updateCartCount() {
      const res = await fetch('/api/cart/count');
      const data = await res.json();
      document.getElementById('nav-cart-count').textContent = data.count;
    }
    updateCartCount();
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
